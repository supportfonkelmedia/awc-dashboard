# Ploi-style deploy: build on GitHub, rsync public/build, git pull + Composer on server.
#   dev  → environment "development"
#   main → environment "production"
# Secrets per environment: SSH_HOST, SSH_USER, SSH_PASSWORD, SSH_PORT, DEPLOY_PATH (+ optional PHP_BIN)

name: Build & deploy

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        type: choice
        required: true
        default: development
        options:
          - development
          - production

run-name: ${{ github.workflow }} (${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.ref == 'refs/heads/main' && 'production' || 'development') }})

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
    steps:
      - id: map
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.target }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="production"
          else
            ENV="development"
          fi
          echo "environment=${ENV}" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: resolve-environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.resolve-environment.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.resolve-environment.outputs.environment }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          coverage: none

      - name: Install Composer deps (Ziggy for Vite)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install & build frontend
        run: |
          npm ci
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vite-build-${{ github.ref_name }}
          path: public/build/
          retention-days: 7

      - name: Install SSH client tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass openssh-client

      - name: Rsync assets to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eo pipefail
          for key in SSH_HOST SSH_USER SSHPASS DEPLOY_PATH; do
            if [ -z "${!key}" ]; then
              echo "Missing GitHub environment secret: ${key}"
              exit 1
            fi
          done
          PORT="${SSH_PORT:-22}"
          echo "Rsync → ${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/public/build/ (port ${PORT})"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          RSYNC_SSH="ssh -p ${PORT} -o StrictHostKeyChecking=yes"
          sshpass -e rsync -avz --delete -e "$RSYNC_SSH" \
            public/build/ \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/public/build/"

      - name: Git pull, Composer & Artisan on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GIT_BRANCH: ${{ github.ref_name }}
          PHP_BIN: ${{ secrets.PHP_BIN }}
        run: |
          set -eo pipefail
          PORT="${SSH_PORT:-22}"
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "DEPLOY_PATH=$(printf %q "$DEPLOY_PATH") GIT_BRANCH=$(printf %q "$GIT_BRANCH") PHP_BIN=$(printf %q "${PHP_BIN:-}") bash -s" \
            < .github/scripts/deploy-remote.sh
